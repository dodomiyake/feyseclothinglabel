<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts/fonts.css">
<style>html,body{margin:0;background:#222}canvas{display:block}</style></head><body><canvas id="c" width="1920" height="1080"></canvas>
<script src="char80.js"></script><script>
const c = document.getElementById('c').getContext('2d');
function draw() {
  const g = c.createLinearGradient(0, 0, 0, 1080); g.addColorStop(0, '#2B1E5A'); g.addColorStop(0.6, '#7A3A8C'); g.addColorStop(1, '#F07A6A'); c.fillStyle = g; c.fillRect(0, 0, 1920, 1080);
  const lab = (s, x, y) => { c.font = "italic 900 34px 'Barlow Condensed'"; c.fillStyle = '#FFE9A8'; c.textAlign = 'center'; c.fillText(s, x, y); };
  c.save(); c.translate(330, 400); c.scale(0.85, 0.85); C80.bust(c, { set: 'day', turn: 0.3, expr: 'cool', bottom: 700 }); c.restore(); lab('DAY · COOL · 3/4', 330, 1040);
  const H = [['night', 0.35, 'smile'], ['club', -0.35, 'grin'], ['dusk', 0.0, 'cool'], ['rain', 0.35, 'shout'], ['dawn', -0.3, 'wink']];
  H.forEach(([s, tn, e], i) => { const x = 800 + (i % 3) * 290, y = 250 + Math.floor(i / 3) * 440; c.save(); c.translate(x, y); c.scale(0.6, 0.6); C80.head(c, { set: s, turn: tn, expr: e }); c.restore(); lab(`${s.toUpperCase()} · ${e.toUpperCase()}`, x, y + 200); });
  c.save(); c.translate(1720, 300); c.scale(0.46, 0.46); C80.body(c, { lsh: -2.6, lel: -0.4, rsh: 0.6, rel: 1.5, lhip: -0.25, lkn: 0.35, rhip: 0.12, rkn: -0.05, lean: 0.05 }, { set: 'night', turn: 0.3, expr: 'grin' }); c.restore(); lab('NIGHT · DANCE', 1720, 1040);
}
window.render = draw;
document.fonts.load("italic 900 34px 'Barlow Condensed'").then(() => document.fonts.ready).then(() => { draw(); window.READY = true; });
</script></body></html>
